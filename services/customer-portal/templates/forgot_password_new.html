{% extends "base.html" %}
{% block title %}Nova senha — Divisions Pay{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 160px); display:flex; flex-direction:column; justify-content:center;">
  <div style="text-align:center; margin-bottom: 28px;">
    <div style="font-size:20px;font-weight:800;letter-spacing:-0.02em;">Defina sua nova senha</div>
    <div style="color:var(--text-dim);font-size:14px;margin-top:6px;">
      Mínimo de 8 caracteres, com letras e números.
    </div>
  </div>

  <form method="post" action="{{ url_for('forgot_password_new_submit') }}" class="card" id="new-password-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nova senha</label>
    <input type="password" name="new_password" id="new_password" placeholder="••••••••" minlength="8" required autofocus>

    <label>Confirmar nova senha</label>
    <input type="password" name="confirm_password" id="confirm_password" placeholder="••••••••" minlength="8" required>
    <div id="mismatch-warning" style="display:none; color:var(--danger); font-size:13px; margin:-8px 0 14px;">As senhas não são iguais.</div>

    <button type="submit" class="btn">Salvar nova senha</button>
  </form>
</div>
<script>
  const form = document.getElementById('new-password-form');
  const pw = document.getElementById('new_password');
  const confirm = document.getElementById('confirm_password');
  const warning = document.getElementById('mismatch-warning');
  form.addEventListener('submit', function (e) {
    if (pw.value !== confirm.value) {
      e.preventDefault();
      warning.style.display = 'block';
      confirm.focus();
    }
  });
</script>
{% endblock %}
