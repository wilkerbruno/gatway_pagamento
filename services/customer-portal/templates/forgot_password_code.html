{% extends "base.html" %}
{% block title %}Digite o código — Divisions Pay{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 160px); display:flex; flex-direction:column; justify-content:center;">
  <div style="text-align:center; margin-bottom: 28px;">
    <div style="font-size:20px;font-weight:800;letter-spacing:-0.02em;">Digite o código</div>
    <div style="color:var(--text-dim);font-size:14px;margin-top:6px;">
      Enviamos um código de 6 dígitos pro e-mail cadastrado nessa conta. Ele vale por 10 minutos.
    </div>
  </div>

  <form method="post" action="{{ url_for('forgot_password_code_submit') }}" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Código de 6 dígitos</label>
    <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" required autofocus style="letter-spacing: 0.4em; text-align:center; font-size:20px; font-weight:700;">
    <button type="submit" class="btn">Confirmar código</button>
  </form>

  <div style="text-align:center; margin-top:20px; display:flex; flex-direction:column; gap:8px;">
    <form method="post" action="{{ url_for('forgot_password_submit') }}" style="margin:0;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="login" value="{{ login }}">
      <button type="submit" style="all:unset; cursor:pointer; color:var(--brand); text-decoration:none; font-size:13px; font-weight:600;">Não recebi — enviar outro código</button>
    </form>
    <a href="{{ url_for('login_form') }}" style="color:var(--text-dim); text-decoration:none; font-size:13px;">← Voltar pro login</a>
  </div>
</div>
{% endblock %}
