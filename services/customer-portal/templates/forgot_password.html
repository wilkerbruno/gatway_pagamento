{% extends "base.html" %}
{% block title %}Esqueci minha senha — Divisions Pay{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 160px); display:flex; flex-direction:column; justify-content:center;">
  <div style="text-align:center; margin-bottom: 28px;">
    <div style="font-size:20px;font-weight:800;letter-spacing:-0.02em;">Esqueci minha senha</div>
    <div style="color:var(--text-dim);font-size:14px;margin-top:6px;">
      Informe o CPF/CNPJ ou e-mail da sua conta. Se ela existir, mandamos um código de 6 dígitos pro e-mail cadastrado.
    </div>
  </div>

  <form method="post" action="{{ url_for('forgot_password_submit') }}" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>CPF/CNPJ ou e-mail</label>
    <input type="text" name="login" placeholder="000.000.000-00 ou voce@email.com" required autofocus>
    <button type="submit" class="btn">Enviar código</button>
  </form>

  <div style="text-align:center; margin-top:20px;">
    <a href="{{ url_for('login_form') }}" style="color:var(--text-dim); text-decoration:none; font-size:13px;">← Voltar pro login</a>
  </div>
</div>
{% endblock %}
