{% extends "base.html" %}
{% block title %}Entrar — Divisions Pay{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 160px); display:flex; flex-direction:column; justify-content:center;">
  <div style="text-align:center; margin-bottom: 36px;">
    <div style="width:64px;height:64px;border-radius:18px;background:#0a0b0d;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
      <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="8" width="7" height="15" rx="2" fill="#ffffff"/>
        <rect x="10" y="27" width="13" height="5" rx="2" fill="#17c3a0"/>
        <path d="M17 8 H21 A10 10 0 0 1 21 28 H17 V23 H21 A5 5 0 0 0 21 13 H17 Z" fill="#17c3a0"/>
      </svg>
    </div>
    <div style="font-size:22px;font-weight:800;letter-spacing:-0.02em;">Divisions Pay</div>
    <div style="color:var(--text-dim);font-size:14px;margin-top:4px;">Sua conta digital, do jeito Divisions</div>
  </div>

  <form method="post" action="{{ url_for('login_submit') }}" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>CPF/CNPJ ou e-mail</label>
    <input type="text" name="login" placeholder="000.000.000-00 ou voce@email.com" required autofocus>

    <label>Senha</label>
    <input type="password" name="password" placeholder="••••••••" required>

    <button type="submit" class="btn">Entrar</button>
  </form>

  <div style="text-align:center; color:var(--text-dim); font-size:13px; margin-top:20px;">
    <a href="{{ url_for('forgot_password_form') }}" style="color:var(--brand); text-decoration:none; font-weight:600;">Esqueci minha senha</a><br>
    <span style="margin-top:6px; display:inline-block;">Ainda não tem acesso? Fale com quem administra sua conta.</span>
  </div>
</div>
{% endblock %}
