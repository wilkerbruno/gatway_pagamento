{% extends "base.html" %}
{% block title %}Gerar PIX{% endblock %}
{% block content %}
  <h1>Gerar cobrança PIX (sandbox)</h1>
  <form class="card" method="post" action="{{ url_for('pix_new_submit') }}">
    <label>Lojista/carteira que recebe</label>
    <select name="merchant_account_id" required>
      {% for c in customers %}
      <option value="{{ c.account.id }}">{{ c.name }}</option>
      {% endfor %}
    </select>
    <label>Valor (R$)</label>
    <input type="text" name="amount_brl" placeholder="10,00" required>
    <br><br>
    <button class="btn" type="submit">Gerar cobrança</button>
  </form>
{% endblock %}
