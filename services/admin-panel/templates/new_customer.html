{% extends "base.html" %}
{% block title %}Novo cliente{% endblock %}
{% block content %}
  <h1>Novo cliente</h1>
  <form class="card" method="post" action="{{ url_for('new_customer_submit') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nome</label>
    <input type="text" name="name" required>
    <label>CPF/CNPJ</label>
    <input type="text" name="document">
    <label>E-mail</label>
    <input type="email" name="email">
    <label>Tipo de carteira</label>
    <select name="kind">
      <option value="customer">Cliente</option>
      <option value="merchant">Lojista</option>
    </select>
    <label>Senha de acesso ao portal do cliente (opcional)</label>
    <input type="password" name="password" placeholder="deixe em branco pra nao dar acesso ao portal">
    <p style="font-size:12px;color:#9aa4b2;margin-top:4px;">
      Se preenchido, o cliente consegue logar no portal dele (documento ou e-mail + essa senha)
      e ver o próprio saldo e extrato — sem enxergar os outros clientes.
    </p>
    <br>
    <button class="btn" type="submit">Criar</button>
  </form>
{% endblock %}
